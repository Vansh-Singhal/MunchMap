services:
  mongo-db:
    image: mongo
    container_name: mongo

    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin

    volumes:
      - mongo_data:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  user:
    build: 
      context: ./UserService
      dockerfile: dockerfile
    
    container_name: user-service

    ports:
      - "3002:3000"

    environment:
      MONGO_URI: mongodb://admin:admin@mongo:27017/?authSource=admin
      JWT_KEY: ${JWT_KEY:?Set JWT_KEY in the root .env file}
      
    depends_on:
      - mongo-db

  vendor:
    build:
      context: ./VendorService
      dockerfile: dockerfile

    container_name: vendor-service

    expose:
      - "3000"

    environment:
      MONGO_URI: mongodb://admin:admin@mongo-db:27017/vendordb?authSource=admin
      MONGO_DB_NAME: vendordb
      JWT_KEY: ${JWT_KEY:?Set JWT_KEY in the root .env file}
    
    depends_on:
      mongo-db:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/vendor?limit=1').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1));"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  menu:
    build:
      context: ./MenuService
      dockerfile: dockerfile

    container_name: menu-service

    ports : 
      - "3003:3000"

    environment:
      MONGO_URI: mongodb://admin:admin@mongo:27017/?authSource=admin
    
    depends_on:
      - mongo-db

  order:
    build:
      context: ./OrderService
      dockerfile: dockerfile

    container_name: order-service

    ports : 
      - "3004:3000"

    environment:
      MONGO_URI: mongodb://admin:admin@mongo:27017/?authSource=admin
    
    depends_on:
      - mongo-db

  gateway:
    build:
      context: ./Gateway
      dockerfile: dockerfile

    container_name: gateway-service

    ports : 
      - "3000:3000"

    environment:
      USER_SERVICE_URL: http://user:3000/api
      VENDOR_SERVICE_URL: http://vendor:3000/api/vendor

    depends_on:
      user:
        condition: service_started
      vendor:
        condition: service_healthy


volumes:
  mongo_data:
